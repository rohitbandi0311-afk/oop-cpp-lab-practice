<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OOP C++ Lab Internal — Quick Practice</title>
<style>
:root{--bg:#0b1020;--card:#121a2d;--card2:#18233c;--text:#edf2ff;--muted:#9eabc7;--accent:#6ea8fe;--green:#35d07f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#090d18,#111b31);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(9,13,24,.92);backdrop-filter:blur(12px);border-bottom:1px solid #263352;padding:18px 22px}
.wrap{max-width:1100px;margin:auto}.title{display:flex;justify-content:space-between;gap:20px;align-items:center}.title h1{margin:0;font-size:24px}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}
input{width:100%;margin-top:15px;padding:13px 15px;border-radius:10px;border:1px solid #31405f;background:#0d1527;color:white;font-size:15px;outline:none}
main{padding:22px}.grid{display:grid;gap:12px}.item{border:1px solid #263554;border-radius:13px;background:var(--card);overflow:hidden}
.q{width:100%;border:0;background:none;color:var(--text);padding:17px;text-align:left;display:flex;align-items:center;gap:13px;cursor:pointer;font-size:15px;font-weight:600}.num{background:#233452;color:#9fc0ff;min-width:34px;height:30px;border-radius:8px;display:grid;place-items:center}.arrow{margin-left:auto;color:#8292b4}.ans{display:none;padding:0 17px 18px;border-top:1px solid #263554;background:#0f1729}.item.open .ans{display:block}.label{color:#8fa2c8;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:15px 0 8px}.codebox{position:relative}.codebox pre{margin:0;background:#080d18;border:1px solid #253452;border-radius:10px;padding:15px;overflow:auto;color:#d9e5ff;font-size:13px;line-height:1.5}.copy{position:absolute;right:9px;top:9px;border:1px solid #3b4e74;background:#182742;color:#dce8ff;border-radius:7px;padding:7px 10px;cursor:pointer}.copy:hover{background:#23365a}.out{background:#09120f;border:1px solid #1d4735;border-radius:10px;padding:12px;color:#8ff0b7;white-space:pre-wrap;font-family:Consolas,monospace;font-size:13px}.count{color:var(--muted);font-size:13px;margin:15px 0 0}
.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:600px){main{padding:12px}.title h1{font-size:19px}.q{font-size:14px}}
</style></head>
<body>
<header><div class="wrap"><div class="title"><div><h1>⚡ OOP Through C++ — Lab Internal</h1><p>36 questions • Click a question to reveal code & expected output</p></div></div>
<input id="search" placeholder="Search question... e.g. inheritance, constructor, vector"></div></header>
<main class="wrap"><div id="list"></div><div id="empty" class="empty" style="display:none">No matching questions.</div></main>
<script>
const data = [{"n": 1, "q": "Find the roots of a quadratic equation.", "code": "#include <iostream>\n#include <cmath>\nusing namespace std;\nint main(){ double a,b,c,d; cin>>a>>b>>c; d=b*b-4*a*c;\nif(d>0) cout<<\"Roots: \"<<(-b+sqrt(d))/(2*a)<<\" \"<<(-b-sqrt(d))/(2*a);\nelse if(d==0) cout<<\"Equal root: \"<<-b/(2*a);\nelse cout<<\"Complex roots\"; }", "out": "Enter 1  -5 6 \u2192 Roots: 3 2"}, {"n": 2, "q": "Find factorial of a given number using recursion.", "code": "#include <iostream>\nusing namespace std;\nlong long fact(int n){ return n<=1?1:n*fact(n-1); }\nint main(){ int n; cin>>n; cout<<\"Factorial = \"<<fact(n); }", "out": "Enter 5 \u2192 Factorial = 120"}, {"n": 3, "q": "Implement scope resolution.", "code": "#include <iostream>\nusing namespace std;\nint x=10;\nint main(){ int x=20; cout<<\"Local x = \"<<x<<\"\\n\"; cout<<\"Global x = \"<<::x; }", "out": "Local x = 20; Global x = 10"}, {"n": 4, "q": "Implement namespaces.", "code": "#include <iostream>\nusing namespace std;\nnamespace A{ int x=10; } namespace B{ int x=20; }\nint main(){ cout<<A::x<<\" \"<<B::x; }", "out": "10 20"}, {"n": 5, "q": "Illustrate the use of default arguments.", "code": "#include <iostream>\nusing namespace std;\nint sum(int a,int b=10){return a+b;}\nint main(){cout<<sum(5)<<\"\\n\"<<sum(5,20);}", "out": "15 then 25"}, {"n": 6, "q": "Illustrate the use of access specifiers.", "code": "#include <iostream>\nusing namespace std;\nclass Demo{ int a=10; protected:int b=20; public:int c=30; public:void show(){cout<<a<<\" \"<<b<<\" \"<<c;} };\nint main(){Demo d; d.show(); cout<<\"\\nPublic = \"<<d.c;}", "out": "10 20 30"}, {"n": 7, "q": "Program to illustrate inline functions.", "code": "#include <iostream>\nusing namespace std;\ninline int square(int n){return n*n;}\nint main(){cout<<\"Square = \"<<square(5);}", "out": "Square = 25"}, {"n": 8, "q": "Program to illustrate function overloading.", "code": "#include <iostream>\nusing namespace std;\nint add(int a,int b){return a+b;} double add(double a,double b){return a+b;}\nint main(){cout<<add(10,20)<<\"\\n\"<<add(2.5,3.5);}", "out": "30 then 6"}, {"n": 9, "q": "Program to illustrate friend function.", "code": "#include <iostream>\nusing namespace std;\nclass Demo{int x; public:Demo(){x=10;} friend void display(Demo);};\nvoid display(Demo d){cout<<\"x = \"<<d.x;}\nint main(){Demo d; display(d);}", "out": "x = 10"}, {"n": 10, "q": "Program to illustrate the use of Constructors and Destructors.", "code": "#include <iostream>\nusing namespace std;\nclass Demo{public:Demo(){cout<<\"Constructor called\\n\";} ~Demo(){cout<<\"Destructor called\\n\";}};\nint main(){Demo d;}", "out": "Constructor called / Destructor called"}, {"n": 11, "q": "Program illustrating Constructor overloading.", "code": "#include <iostream>\nusing namespace std;\nclass Student{int id; public:Student(){id=0;} Student(int x){id=x;} void show(){cout<<id<<\" \";}};\nint main(){Student a,b(101); a.show(); b.show();}", "out": "0 101"}, {"n": 12, "q": "Program illustrating Copy Constructor.", "code": "#include <iostream>\nusing namespace std;\nclass Demo{int x; public:Demo(int a):x(a){} Demo(const Demo& d):x(d.x){} void show(){cout<<x;}};\nint main(){Demo d1(10),d2(d1); d2.show();}", "out": "10"}, {"n": 13, "q": "Overload Unary Operator using member function.", "code": "#include <iostream>\nusing namespace std;\nclass Number{int x; public:Number(int a):x(a){} void operator++(){++x;} void show(){cout<<x;}};\nint main(){Number n(10); ++n; n.show();}", "out": "11"}, {"n": 14, "q": "Overload Binary Operators using member function.", "code": "#include <iostream>\nusing namespace std;\nclass Number{int x; public:Number(int a):x(a){} Number operator+(const Number& n){return Number(x+n.x);} void show(){cout<<x;}};\nint main(){Number a(10),b(20),c=a+b; c.show();}", "out": "30"}, {"n": 15, "q": "Overload Binary Operators using friend function.", "code": "#include <iostream>\nusing namespace std;\nclass Number{int x; public:Number(int a):x(a){} friend Number operator+(Number,Number); void show(){cout<<x;}};\nNumber operator+(Number a,Number b){return Number(a.x+b.x);}\nint main(){Number a(10),b(20),c=a+b; c.show();}", "out": "30"}, {"n": 16, "q": "Implement Program for Single Inheritance.", "code": "#include <iostream>\nusing namespace std;\nclass Animal{public:void eat(){cout<<\"Eating\\n\";}};\nclass Dog:public Animal{public:void bark(){cout<<\"Barking\";}};\nint main(){Dog d; d.eat(); d.bark();}", "out": "Eating / Barking"}, {"n": 17, "q": "Implement Program for Multiple Inheritances.", "code": "#include <iostream>\nusing namespace std;\nclass A{public:void showA(){cout<<\"A\\n\";}}; class B{public:void showB(){cout<<\"B\\n\";}};\nclass C:public A,public B{};\nint main(){C c;c.showA();c.showB();}", "out": "A / B"}, {"n": 18, "q": "Implement Program for Multi-level inheritance.", "code": "#include <iostream>\nusing namespace std;\nclass A{public:void showA(){cout<<\"A\\n\";}}; class B:public A{public:void showB(){cout<<\"B\\n\";}};\nclass C:public B{public:void showC(){cout<<\"C\";}};\nint main(){C c;c.showA();c.showB();c.showC();}", "out": "A / B / C"}, {"n": 19, "q": "Implement Program for Hierarchical Inheritance.", "code": "#include <iostream>\nusing namespace std;\nclass Animal{public:void eat(){cout<<\"Eating\\n\";}}; class Dog:public Animal{public:void bark(){cout<<\"Bark\\n\";}};\nclass Cat:public Animal{public:void meow(){cout<<\"Meow\";}};\nint main(){Dog d;Cat c;d.eat();d.bark();c.eat();c.meow();}", "out": "Eating / Bark / Eating / Meow"}, {"n": 20, "q": "Implement Program for Hybrid inheritance.", "code": "#include <iostream>\nusing namespace std;\nclass A{public:void show(){cout<<\"A\";}}; class B:public A{}; class C:public A{}; class D:public B,public C{};\nint main(){D d; d.B::show();}", "out": "A"}, {"n": 21, "q": "Order of execution of constructors and destructors in inheritance.", "code": "#include <iostream>\nusing namespace std;\nclass A{public:A(){cout<<\"A Constructor\\n\";}~A(){cout<<\"A Destructor\\n\";}};\nclass B:public A{public:B(){cout<<\"B Constructor\\n\";}~B(){cout<<\"B Destructor\\n\";}};\nclass C:public B{public:C(){cout<<\"C Constructor\\n\";}~C(){cout<<\"C Destructor\\n\";}};\nint main(){C c;}", "out": "A Constructor / B Constructor / C Constructor / C Destructor / B Destructor / A Destructor"}, {"n": 22, "q": "Illustrate the use of object as a class member.", "code": "#include <iostream>\nusing namespace std;\nclass Address{public:void show(){cout<<\"Kakinada\";}};\nclass Student{Address addr; public:void show(){addr.show();}};\nint main(){Student s;s.show();}", "out": "Kakinada"}, {"n": 23, "q": "Illustrate the use of pointer to a class.", "code": "#include <iostream>\nusing namespace std;\nclass Student{public:void show(){cout<<\"Hello Student\";}};\nint main(){Student s; Student* p=&s; p->show();}", "out": "Hello Student"}, {"n": 24, "q": "Illustrate the use of this pointer.", "code": "#include <iostream>\nusing namespace std;\nclass Student{int id; public:void setId(int id){this->id=id;} void show(){cout<<this->id;}};\nint main(){Student s;s.setId(101);s.show();}", "out": "101"}, {"n": 25, "q": "Illustrate the use of Virtual Base Class.", "code": "#include <iostream>\nusing namespace std;\nclass A{public:int x=10;}; class B:virtual public A{}; class C:virtual public A{}; class D:public B,public C{public:void show(){cout<<x;}};\nint main(){D d;d.show();}", "out": "10"}, {"n": 26, "q": "Illustrate the use of virtual functions.", "code": "#include <iostream>\nusing namespace std;\nclass Animal{public:virtual void sound(){cout<<\"Animal sound\";}};\nclass Dog:public Animal{public:void sound() override{cout<<\"Dog barks\";}};\nint main(){Animal* p;Dog d;p=&d;p->sound();}", "out": "Dog barks"}, {"n": 27, "q": "Implement pure virtual function and calculate the area of different shapes by using abstract class.", "code": "#include <iostream>\nusing namespace std;\nclass Shape{public:virtual void area()=0;};\nclass Circle:public Shape{public:void area(){double r=5;cout<<\"Circle Area = \"<<3.14*r*r<<\"\\n\";}};\nclass Rectangle:public Shape{public:void area(){int l=5,b=4;cout<<\"Rectangle Area = \"<<l*b;}};\nint main(){Circle c;Rectangle r;c.area();r.area();}", "out": "Circle Area = 78.5 / Rectangle Area = 20"}, {"n": 28, "q": "Illustrate the use of function template.", "code": "#include <iostream>\nusing namespace std;\ntemplate<class T>T maximum(T a,T b){return a>b?a:b;}\nint main(){cout<<maximum(10,20)<<\" \"<<maximum(2.5,1.5);}", "out": "20 2.5"}, {"n": 29, "q": "Implement template class.", "code": "#include <iostream>\nusing namespace std;\ntemplate<class T>class Demo{T value;public:Demo(T v):value(v){}void show(){cout<<value;}};\nint main(){Demo<int> a(10);Demo<double> b(5.5);a.show();cout<<\" \";b.show();}", "out": "10 5.5"}, {"n": 30, "q": "Implement class templates with multiple parameters.", "code": "#include <iostream>\nusing namespace std;\ntemplate<class T,class U>class Demo{T a;U b;public:Demo(T x,U y):a(x),b(y){}void show(){cout<<a<<\" \"<<b;}};\nint main(){Demo<int,double> d(10,5.5);d.show();}", "out": "10 5.5"}, {"n": 31, "q": "Implement Exceptions handling.", "code": "#include <iostream>\nusing namespace std;\nint main(){int a,b;cin>>a>>b;try{if(b==0)throw b;cout<<a/b;}catch(int){cout<<\"Division by zero\";}}", "out": "Division by zero"}, {"n": 32, "q": "Illustrate the use of multiple catch statements.", "code": "#include <iostream>\nusing namespace std;\nint main(){try{int c;cin>>c;if(c==1)throw 10;else if(c==2)throw 2.5;else throw 'A';}\ncatch(int x){cout<<\"Integer: \"<<x;}catch(double x){cout<<\"Double: \"<<x;}catch(char x){cout<<\"Character: \"<<x;}}", "out": "Integer: 10 / Double: 2.5 / Character: A"}, {"n": 33, "q": "Implement List and its Operations.", "code": "#include <iostream>\n#include <list>\nusing namespace std;\nint main(){list<int> l={10,20,30};l.push_front(5);l.push_back(40);for(int x:l)cout<<x<<\" \";l.pop_front();l.pop_back();}", "out": "5 10 20 30 40"}, {"n": 34, "q": "Implement Vector and its Operations.", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\nint main(){vector<int> v={10,20,30};v.push_back(40);for(int x:v)cout<<x<<\" \";v.pop_back();}", "out": "10 20 30 40"}, {"n": 35, "q": "Implement Deque and its Operations.", "code": "#include <iostream>\n#include <deque>\nusing namespace std;\nint main(){deque<int> d={20,30};d.push_front(10);d.push_back(40);for(int x:d)cout<<x<<\" \";d.pop_front();d.pop_back();}", "out": "10 20 30 40"}, {"n": 36, "q": "Implement Map and its Operations.", "code": "#include <iostream>\n#include <map>\nusing namespace std;\nint main(){map<int,string> m{{1,\"Rohith\"},{2,\"Kavya\"},{3,\"Sneha\"}};for(auto p:m)cout<<p.first<<\" \"<<p.second<<\"\\n\";m.erase(2);}", "out": "1 Rohith / 2 Kavya / 3 Sneha"}];
const list=document.getElementById('list'), search=document.getElementById('search');
function render(filter=''){
  list.innerHTML='';
  const items=data.filter(x=>(x.q+' '+x.n).toLowerCase().includes(filter.toLowerCase()));
  document.getElementById('empty').style.display=items.length?'none':'block';
  items.forEach(x=>{
    const el=document.createElement('div');el.className='item';
    el.innerHTML=`<button class="q"><span class="num">${x.n}</span><span>${x.q}</span><span class="arrow">⌄</span></button>
    <div class="ans"><div class="label">C++ Code</div><div class="codebox"><button class="copy">Copy Code</button><pre><code></code></pre></div>
    <div class="label">Expected Output</div><div class="out"></div></div>`;
    el.querySelector('code').textContent=x.code;el.querySelector('.out').textContent=x.out;
    el.querySelector('.q').onclick=()=>{el.classList.toggle('open');el.querySelector('.arrow').textContent=el.classList.contains('open')?'⌃':'⌄'};
    el.querySelector('.copy').onclick=async(e)=>{e.stopPropagation();const b=e.currentTarget;try{await navigator.clipboard.writeText(x.code);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy Code',1200)}catch{b.textContent='Select & Copy'}};
    list.appendChild(el);
  });
}
search.addEventListener('input',e=>render(e.target.value));render();
</script></body></html>
